trigger:
  branches:
    include:
      - main

pool:
  name: 'hacker' # Your self-hosted agent pool

variables:
  # Azure Resource Manager Service Connection configured in Project Settings
  azureServiceConnection: 'azure-service-connection-name'
  
  # Backend Storage details for Terraform remote state
  backendResourceGroup: 'tfstate-rg'
  backendStorageAccount: 'tfstatestorageacct'
  backendContainer: 'tfstate'
  backendKey: 'hacker.terraform.tfstate'
  
  # Path to your Terraform files relative to repo root
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  terraformVersion: '1.8.5'

stages:
- stage: BuildAndPlan
  displayName: 'Terraform Init, Validate & Plan'
  jobs:
  - job: Plan
    displayName: 'Generate Execution Plan'
    steps:
    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmBlobStorageKey: '$(backendKey)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan
      displayName: 'Publish Plan Artifact'

- stage: Deploy
  displayName: 'Terraform Apply'
  dependsOn: BuildAndPlan
  condition: succeeded()
  jobs:
  - deployment: Apply
    displayName: 'Apply Infrastructure Changes'
    # Define an environment in Azure DevOps -> Pipelines -> Environments to add approval gates
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - download: current
            artifact: tfplan
            displayName: 'Download Plan Artifact'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmBlobStorageKey: '$(backendKey)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'